# xcodegen spec for Chess Best Move. Generate the project with `xcodegen generate`;
# never edit ChessBestMove.xcodeproj by hand (it is git-ignored and rebuilt from this file).
#
# App sources and resources are Xcode synchronized folders (`type: syncedFolder`):
# adding, removing or renaming a file inside them needs no regeneration. Regenerate only
# after changing this file.
name: ChessBestMove

options:
  bundleIdPrefix: com.motomatic.chessbestmove
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.6"

attributes:
  LastUpgradeCheck: 2660
  LastSwiftUpdateCheck: 2660

packages:
  ChessCore:
    path: Packages/ChessCore
  ChessEngine:
    path: Packages/ChessEngine
  ChessVision:
    path: Packages/ChessVision

settings:
  base:
    # The Apple Developer team the App Store build is signed with. To build with your own
    # account, replace it with your team identifier, or build without signing:
    # `xcodebuild build ... CODE_SIGNING_ALLOWED=NO`.
    DEVELOPMENT_TEAM: RJB472R448
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Declarations are nonisolated unless annotated; the app's contracts spell out
    # @MainActor explicitly.
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  configs:
    Release:
      # Stockfish itself is compiled with -O3 and full LTO in Release by
      # Packages/ChessEngine/Package.swift (`.when(configuration: .release)`), which
      # SwiftPM applies because this configuration is named "Release".
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: s
      DEAD_CODE_STRIPPING: YES
      VALIDATE_PRODUCT: YES

targets:
  ChessBestMove:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        type: syncedFolder
      - path: App/Resources
        type: syncedFolder
      # The app group, the hand-over URL grammar and the container the share extension writes
      # into. Compiled into both targets from one folder (see ChessBestMoveShare below). It is
      # outside App/Sources because a synchronized folder belongs to one target, and
      # App/Sources/App/ShareImport.swift does not compile without it.
      - path: ShareExtension/Shared
    dependencies:
      - package: ChessCore
      - package: ChessEngine
      - package: ChessVision
        product: ChessVision
      # The share extension ships inside this app bundle
      # (PlugIns/ChessBestMoveShare.appex) and has no App Store Connect record of its own.
      - target: ChessBestMoveShare
    preBuildScripts:
      # Release gate: an archive (ACTION=install) fails while App/Sources or App/Info.plist
      # still holds a URL that must not reach a release: a reserved example domain, a URL whose
      # text contains TODO, or a link to Apple's standard End User License Agreement, whose
      # usage rules conflict with GPLv3 section 10. The script's own comment lists the patterns
      # it looks for. Ordinary Debug and Release builds skip the check. It walks the whole
      # App/Sources folder, which is why this target turns the user script sandbox off (see
      # ENABLE_USER_SCRIPT_SANDBOXING below).
      #
      # That script then runs scripts/check-release-source-tag.sh, which builds the two source
      # links the app shows from the version being built and asks whether they answer, because
      # those links are assembled at run time and no pattern can see whether the tag behind them
      # exists. With no network it cannot ask and lets the archive through, and
      # CHESS_BEST_MOVE_SOURCE_TAG_CHECK=0 turns it off. If you distribute a changed version of
      # this app, point SettingsLinks.appSourceRepository at your own published source first.
      - name: Block archives with placeholder URLs
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
        script: |
          "${SRCROOT}/scripts/check-release-placeholders.sh"
    info:
      path: App/Info.plist
      properties:
        # The name under the icon. The built product stays "Chess Best Move.app".
        CFBundleDisplayName: Chess Best Move
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        SKIncludeConsumableInAppPurchaseHistory: true
        NSPhotoLibraryUsageDescription: "Chess Best Move reads your most recent screenshot to find the chessboard in it. Your photos stay on your device."
        # The share extension writes the shared image into the app group container and opens the
        # app at chessbestmove://shared-image?id=<uuid> (ShareExtension/Shared/ShareInbox.swift).
        # A custom URL scheme is registered nowhere but here.
        CFBundleURLTypes:
          - CFBundleURLName: com.motomatic.chessbestmove.sharedimage
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - chessbestmove
        # The only bundled typeface: the chess piece glyphs (U+2654 to U+265F), which the
        # system font does not have. All other text is SF Pro or SF Mono.
        UIAppFonts:
          - NotoSansSymbols2-Regular.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      # Written by xcodegen from these properties; never edit the file by hand. The share
      # extension target below carries the identical group, which is what gives the two
      # processes one container to hand images over in. Nothing else is granted here.
      path: App/ChessBestMove.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.motomatic.chessbestmove
    settings:
      base:
        PRODUCT_NAME: Chess Best Move
        PRODUCT_MODULE_NAME: ChessBestMove
        PRODUCT_BUNDLE_IDENTIFIER: com.motomatic.chessbestmove
        GENERATE_INFOPLIST_FILE: NO
        # The release gate pre-build script reads every Swift file under App/Sources. The user
        # script sandbox grants a script only the paths it declares, and declaring the folder
        # does not grant the files inside it: with the sandbox on, the script's grep is denied
        # and finds nothing, so an archive with placeholder URLs would pass. The script counts
        # the files it read and fails when it cannot read them, and the sandbox stays off so the
        # gate can do its work. This is the target's only script phase.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  # The share extension: "Best Move" in the share sheet of the screenshot preview
  # (including Markup) and of Photos. It accepts one image, copies it into the app group
  # container and opens the app at it; it never loads the recognizer or the engine, because an
  # app extension is given a fraction of the memory an app gets.
  ChessBestMoveShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/Sources
      # What both processes have to agree on: the app group, the URL grammar and the container.
      # The app target compiles this same folder, so neither side can drift from the other.
      - path: ShareExtension/Shared
      # The app's design system, so the extension's screen is drawn in the app's own colors and
      # type tokens rather than in a second set that could drift from design.md.
      - path: App/Sources/DesignSystem/Palette.swift
      - path: App/Sources/DesignSystem/Typography.swift
      - path: App/Sources/DesignSystem/Metrics.swift
      - path: App/Sources/DesignSystem/Components/Buttons.swift
      - path: App/Sources/DesignSystem/Components/CloseButton.swift
      # The copy the app shares between screens. The type scale's SwiftUI preview sets one of
      # its lines, so the design system does not compile without it.
      - path: App/Sources/App/AppCopy.swift
      # The extension's own privacy manifest. Apple reads one per bundle, and an app extension
      # is its own bundle, so the app's manifest does not speak for this one. It declares the
      # same thing the app's does - no tracking, no tracking domains, nothing collected - plus
      # the one required-reason API this binary calls: it reads and sets the modification date
      # of the files it writes into the app group container (FileTimestamp, reason C617.1).
      - path: ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        # The share sheet reads this. It matches the app's own springboard label above, so the
        # two places the user sees the app's name agree.
        CFBundleDisplayName: Chess Best Move
        CFBundleName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Exactly one image and nothing else: the extension does not offer itself for text,
            # for URLs, for several images at once, or for anything it cannot analyze.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      # The same app group as the app target above, written by xcodegen from these properties.
      path: ShareExtension/ChessBestMoveShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.motomatic.chessbestmove
    settings:
      base:
        PRODUCT_NAME: ChessBestMoveShare
        PRODUCT_MODULE_NAME: ChessBestMoveShare
        # An app extension's bundle id must be the containing app's with exactly one more
        # component.
        PRODUCT_BUNDLE_IDENTIFIER: com.motomatic.chessbestmove.share
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

schemes:
  ChessBestMove:
    build:
      targets:
        ChessBestMove: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
